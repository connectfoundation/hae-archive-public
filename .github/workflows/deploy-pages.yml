name: Deploy archive with demo videos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site and same-origin videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/videos
          cp index.html app.js styles.css teams.json *.svg *.png _site/
          gh release download demo-videos-2026-10-15 --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir _site/videos
          python3 -c 'import json,pathlib; root=pathlib.Path("_site"); teams=json.loads((root/"teams.json").read_text()); missing=[t["videoUrl"] for t in teams if t.get("videoUrl","").startswith("videos/") and not (root/t["videoUrl"]).is_file()]; assert not missing, missing'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
